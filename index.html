<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echoes of Giselle — Intro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold:       #c9a84c;
      --gold-pale:  #e8d5a3;
      --white-mist: rgba(255, 255, 255, 0.82);
      --black:      #0a0806;
      --red:        #7a1a1a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: 'Cormorant Garamond', serif;
      color: var(--white-mist);
    }

    /* ───────────────── ENTER SCREEN ───────────────── */

    #enter-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at center, rgba(40,20,20,0.55), rgba(5,3,3,0.96)),
        #000;

      cursor: pointer;
      transition: opacity 1.2s ease;
    }

    #enter-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #enter-content {
      text-align: center;
      transform: translateY(-2%);
    }

    #enter-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.6rem, 6vw, 5rem);
      letter-spacing: 0.14em;
      color: var(--gold-pale);

      opacity: 0;
      transform: translateY(24px);

      animation: enterFadeUp 1.6s ease forwards;
      text-shadow:
        0 0 18px rgba(201,168,76,0.15),
        0 0 40px rgba(201,168,76,0.08);
    }

    #enter-subtitle {
      margin-top: 1.4rem;

      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      letter-spacing: 0.28em;
      text-transform: lowercase;

      color: rgba(255,255,255,0.72);

      opacity: 0;
      transform: translateY(16px);

      animation:
        enterFadeUp 1.6s ease forwards,
        breathe 2.8s ease-in-out infinite;

      animation-delay:
        0.25s,
        1.6s;
    }

    @keyframes enterFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes breathe {
      0%,100% { opacity: 0.35; }
      50%     { opacity: 0.95; }
    }

    /* ───────────────── Shared text animations ───────────────── */

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #clause-text {
      position: absolute;
      bottom: 35%;
      left: 50%;
      transform: translateX(-50%);

      width: 70%;
      text-align: center;

      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.6rem, 3vw, 2.4rem);

      color: rgba(232,220,200,0.88);

      letter-spacing: 0.04em;
      line-height: 1.7;

      opacity: 0;
      transition: opacity 0.5s ease;

      pointer-events: none;
    }

    #click-prompt {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);

      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;

      color: rgba(200,150,12,0.6);

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.5s ease;
    }

    @keyframes clausePromptBreathe {
      0%,100% { opacity: 0.3; }
      50%     { opacity: 0.8; }
    }

    #click-prompt.breathing {
      animation: clausePromptBreathe 2.5s ease-in-out infinite;
      transition: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<!-- ENTER SCREEN -->
<div id="enter-screen">
  <div id="enter-content">
    <div id="enter-title">Echoes of Giselle</div>
    <div id="enter-subtitle">click to enter</div>
  </div>
</div>

<div id="ui"></div>

<audio
  id="intro-music"
  src="testing/assets/intro-music.mp3"
  loop
  preload="auto">
</audio>

<script type="module">
import * as THREE from 'three';

/* ───────────────── MUSIC ───────────────── */

const _introMusic = document.getElementById('intro-music');

_introMusic.volume = 0;

let _musicStarted = false;

async function _startMusic() {
  if (_musicStarted) return;

  _musicStarted = true;

  try {
    await _introMusic.play();
  } catch (err) {
    console.log('Autoplay blocked');
  }

  let v = 0;

  const fadeIn = setInterval(() => {
    v = Math.min(0.3, v + 0.015);

    _introMusic.volume = v;

    if (v >= 0.3) clearInterval(fadeIn);
  }, 100);
}

function _stopMusic() {
  const fadeOut = setInterval(() => {
    _introMusic.volume = Math.max(
      0,
      _introMusic.volume - 0.067
    );

    if (_introMusic.volume <= 0) {
      _introMusic.pause();
      clearInterval(fadeOut);
    }
  }, 100);
}

/* ───────────────── ENTER SCREEN ───────────────── */

const enterScreen = document.getElementById('enter-screen');

enterScreen.addEventListener('click', async () => {

  await _startMusic();

  enterScreen.classList.add('hidden');

  setTimeout(() => {
    enterScreen.remove();
  }, 1200);

}, { once: true });

/* ───────────────── DEBUG ───────────────── */

const DEBUG_START_PAGE = 0;

/* ───────────────── RENDERER ───────────────── */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;

document.body.appendChild(renderer.domElement);

/* ───────────────── SCENE / CAMERA ───────────────── */

let currentScene = new THREE.Scene();

let currentCamera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

/* ───────────────── CLOCK ───────────────── */

const _clock = new THREE.Clock();

/* ───────────────── PAGE SYSTEM ───────────────── */

let currentPage = 0;
let transitioning = false;

let _pageUpdate = null;
let _pageExit = null;

/* ───────────────── EASING ───────────────── */

function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

/* ───────────────── CLAUSE SYSTEM ───────────────── */

let _clausesDone = false;

const clauseTimeouts = [];

function splitClauses(text) {
  return text
    .split(/(?<=[.!?,;:—])/)
    .map(s => s.trim())
    .filter(Boolean);
}

function playClause(clauses, index, onComplete) {

  if (index >= clauses.length) {
    onComplete();
    return;
  }

  const clauseEl = document.getElementById('clause-text');

  if (!clauseEl) return;

  clauseEl.textContent = clauses[index];
  clauseEl.style.opacity = '1';

  const t1 = setTimeout(() => {

    clauseEl.style.opacity = '0';

    const t2 = setTimeout(() => {
      playClause(clauses, index + 1, onComplete);
    }, 500);

    clauseTimeouts.push(t2);

  }, 2500);

  clauseTimeouts.push(t1);
}

function startClausePlayback(bodyText) {

  _clausesDone = false;

  clauseTimeouts.length = 0;

  const clauses = splitClauses(bodyText);

  playClause(clauses, 0, () => {

    _clausesDone = true;

    const promptEl =
      document.getElementById('click-prompt');

    if (promptEl) {
      promptEl.classList.add('breathing');
    }
  });
}

function cancelClausePlayback() {

  for (const id of clauseTimeouts) {
    clearTimeout(id);
  }

  clauseTimeouts.length = 0;

  _clausesDone = false;

  const clauseEl =
    document.getElementById('clause-text');

  const promptEl =
    document.getElementById('click-prompt');

  if (clauseEl) {
    clauseEl.style.opacity = '0';
  }

  if (promptEl) {
    promptEl.classList.remove('breathing');
    promptEl.style.opacity = '0';
  }
}

/* ───────────────── CLICK ADVANCE ───────────────── */

renderer.domElement.addEventListener('click', () => {

  if (!transitioning && _clausesDone) {
    goToPage(currentPage + 1);
  }

});

/* ───────────────── PAGE 0 (example minimal) ───────────────── */

function initPage0() {

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#03010a');

  currentScene = scene;

  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.z = 3;

  currentCamera = camera;

  const ambient = new THREE.AmbientLight(0xffffff, 0.5);

  scene.add(ambient);

  const geometry =
    new THREE.TetrahedronGeometry(0.6);

  const material =
    new THREE.MeshStandardMaterial({
      color: 0x6b1212,
      metalness: 0.5,
      roughness: 0.3
    });

  const mesh = new THREE.Mesh(geometry, material);

  scene.add(mesh);

  const ui = document.getElementById('ui');

  ui.innerHTML = `
    <div style="
      position:absolute;
      bottom:12%;
      left:50%;
      transform:translateX(-50%);
      text-align:center;
      width:80%;
      max-width:640px;
    ">
      <div class="fade-up visible" style="
        font-family:'Cinzel',serif;
        font-size:0.75rem;
        letter-spacing:0.4em;
        color:var(--gold);
        text-transform:uppercase;
        margin-bottom:0.8rem;
      ">
        ACT I
      </div>

      <div class="fade-up visible" style="
        font-family:'Cinzel',serif;
        font-size:2.4rem;
        letter-spacing:0.08em;
        color:var(--gold-pale);
        margin-bottom:1.2rem;
      ">
        A Love Betrayed
      </div>
    </div>

    <div id="clause-text"></div>

    <div id="click-prompt">
      click to continue
    </div>
  `;

  setTimeout(() => {

    startClausePlayback(`
      Giselle was a peasant girl who fell in love
      with Albrecht — a nobleman disguised as one
      of her own.
    `);

  }, 1200);

  _pageUpdate = () => {
    mesh.rotation.y += 0.005;
  };

  _pageExit = (onComplete) => {

    cancelClausePlayback();

    geometry.dispose();
    material.dispose();

    ui.innerHTML = '';

    onComplete();
  };
}

/* ───────────────── PAGE MANAGER ───────────────── */

function goToPage(n) {

  if (transitioning) return;

  const doEnter = () => {

    currentPage = n;

    transitioning = false;

    if (n === 0) {
      initPage0();
    }

    else if (n === 1) {

      transitioning = true;

      _stopMusic();

      setTimeout(() => {
        window.location.href = 'musicbox.html';
      }, 1500);
    }
  };

  if (_pageExit) {

    transitioning = true;

    _pageExit(doEnter);

  } else {

    doEnter();
  }
}

/* ───────────────── RESIZE ───────────────── */

window.addEventListener('resize', () => {

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  currentCamera.aspect =
    window.innerWidth / window.innerHeight;

  currentCamera.updateProjectionMatrix();
});

/* ───────────────── ANIMATE ───────────────── */

function animate() {

  requestAnimationFrame(animate);

  const t = _clock.getElapsedTime();

  if (_pageUpdate) {
    _pageUpdate(t);
  }

  renderer.clear();

  renderer.render(
    currentScene,
    currentCamera
  );
}

/* ───────────────── BOOT ───────────────── */

goToPage(DEBUG_START_PAGE);

animate();

</script>

</body>
</html>
